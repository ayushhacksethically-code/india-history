    <!-- Chevron Down Icon -->
    <g id="motif-chevron">
      <polyline points="6 9 12 15 18 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Ancient Pot Motif -->
    <g id="motif-pot">
      <ellipse cx="16" cy="9" rx="7" ry="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M9 10 C6 15, 6 22, 10 26 C13 28, 19 28, 22 26 C26 22, 26 15, 23 10 Z" fill="rgba(212,175,55,0.15)" stroke="currentColor" stroke-width="1.8"/>
      <path d="M9 16 Q16 19 23 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2,2"/>
    </g>

    <!-- Copper Blade Motif -->
    <g id="motif-blade">
      <path d="M14 4 L18 4 L22 26 C22 27, 20 28, 16 28 C12 28, 10 27, 10 26 Z" fill="rgba(212,175,55,0.2)" stroke="currentColor" stroke-width="1.8"/>
