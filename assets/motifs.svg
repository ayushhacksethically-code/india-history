        <line x1="50" y1="50" x2="70.5" y2="14.5" /><line x1="50" y1="50" x2="79" y2="21" />
        <line x1="50" y1="50" x2="85.5" y2="29.5" /><line x1="50" y1="50" x2="89.6" y2="39.4" />
        <line x1="50" y1="50" x2="91" y2="50" /><line x1="50" y1="50" x2="89.6" y2="60.6" />
        <line x1="50" y1="50" x2="85.5" y2="70.5" /><line x1="50" y1="50" x2="79" y2="79" />
        <line x1="50" y1="50" x2="70.5" y2="85.5" /><line x1="50" y1="50" x2="60.6" y2="89.6" />
        <line x1="50" y1="50" x2="50" y2="91" /><line x1="50" y1="50" x2="39.4" y2="89.6" />
        <line x1="50" y1="50" x2="29.5" y2="85.5" /><line x1="50" y1="50" x2="21" y2="79" />
        <line x1="50" y1="50" x2="14.5" y2="70.5" /><line x1="50" y1="50" x2="10.4" y2="60.6" />
        <line x1="50" y1="50" x2="9" y2="50" /><line x1="50" y1="50" x2="10.4" y2="39.4" />
        <line x1="50" y1="50" x2="14.5" y2="29.5" /><line x1="50" y1="50" x2="21" y2="21" />
        <line x1="50" y1="50" x2="29.5" y2="14.5" /><line x1="50" y1="50" x2="39.4" y2="10.4" />
      </g>
