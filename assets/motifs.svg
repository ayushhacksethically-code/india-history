      <circle cx="16" cy="10" r="1.5" fill="currentColor"/>
    </g>

    <!-- Grain Stalk Motif -->
    <g id="motif-grain">
      <path d="M16 28 C16 18, 16 10, 16 4" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M16 8 C12 6, 10 10, 16 12" fill="rgba(212,175,55,0.2)" stroke="currentColor" stroke-width="1.5"/>
      <path d="M16 8 C20 6, 22 10, 16 12" fill="rgba(212,175,55,0.2)" stroke="currentColor" stroke-width="1.5"/>
      <path d="M16 14 C11 12, 9 16, 16 18" fill="rgba(212,175,55,0.2)" stroke="currentColor" stroke-width="1.5"/>
      <path d="M16 14 C21 12, 23 16, 16 18" fill="rgba(212,175,55,0.2)" stroke="currentColor" stroke-width="1.5"/>
      <path d="M16 20 C12 18, 10 22, 16 24" fill="rgba(212,175,55,0.2)" stroke="currentColor" stroke-width="1.5"/>
      <path d="M16 20 C20 18, 22 22, 16 24" fill="rgba(212,175,55,0.2)" stroke="currentColor" stroke-width="1.5"/>
    </g>
  </defs>
